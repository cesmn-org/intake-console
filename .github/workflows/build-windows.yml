name: Build Windows kiosk

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download Electron runtime
        run: node node_modules/electron/install.js

      - name: Build Windows portable executable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # GitHub Actions artifacts require authentication to download. Publish the
      # executable as a release asset so anyone can download it from the public
      # repository's Releases page.
      - name: Publish public Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --target "$GITHUB_SHA" \
              --title "Latest Windows build" \
              --notes "Latest Windows build from commit $GITHUB_SHA" \
              --latest=false
          fi
          gh release upload latest dist/*.exe --clobber
